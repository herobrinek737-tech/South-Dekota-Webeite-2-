<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Seite nicht gefunden</title>
    <style>
        * {
            box-sizing: border-box;
            /* Verhindert Textmarkierung beim wilden Tippen auf dem Handy */
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            color: #f39c12;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 3px 3px #e74c3c;
        }
        p {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #bdc3c7;
        }
        .home-btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: background 0.2s;
            text-transform: uppercase;
        }
        
        /* Game Container */
        #game-container {
            width: 300px;
            height: 450px;
            background: linear-gradient(to bottom, #7f8c8d, #34495e);
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            border: 4px solid #2c3e50;
        }
        /* Lanes */
        .lane {
            position: absolute;
            width: 100px;
            height: 100%;
            border-right: 2px dashed rgba(255,255,255,0.3);
        }
        .lane:nth-child(1) { left: 0; }
        .lane:nth-child(2) { left: 100px; }
        .lane:nth-child(3) { left: 200px; border-right: none; }
        
        /* UI Elements */
        #score-board {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-weight: bold;
            font-size: 1.5rem;
            z-index: 10;
            text-shadow: 2px 2px #000;
        }
        
        /* Entities */
        #player {
            width: 60px;
            height: 80px;
            background-color: #e74c3c;
            position: absolute;
            bottom: 20px;
            border-radius: 10px;
            transition: left 0.15s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            z-index: 5;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }
        .obstacle {
            width: 80px;
            height: 120px;
            background-color: #f1c40f;
            position: absolute;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        
        /* Overlay */
        #game-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        #game-overlay h2 {
            color: #e74c3c;
            font-size: 2.5rem;
            margin: 0 0 15px 0;
        }
        #game-overlay button {
            padding: 12px 25px;
            font-size: 1.2rem;
            cursor: pointer;
            background: #2ecc71;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Touch Controls */
        #touch-controls {
            display: none; /* Am PC standardmäßig ausblenden */
            width: 300px;
            justify-content: space-between;
            margin-top: 20px;
        }
        .touch-btn {
            width: 120px;
            height: 60px;
            font-size: 2rem;
            background-color: #34495e;
            color: #fff;
            border: 2px solid #2c3e50;
            border-radius: 12px;
            box-shadow: 0 6px #1a252f;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .touch-btn:active {
            box-shadow: 0 0 #1a252f;
            transform: translateY(6px);
            background-color: #2c3e50;
        }

        /* Responsive: Zeige Buttons auf Smartphones */
        @media (max-width: 768px) {
            #touch-controls {
                display: flex;
            }
            .controls-hint {
                display: none;
            }
        }
        
        .controls-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <h1>404 - ERROR</h1>
    <p>Diese Seite existiert nicht.</p>
    
    <!-- Hier wurde der Link aktualisiert -->
    <a href="https://herobrinek737-tech.github.io/South-Dekota-Webeite-2-/" class="home-btn">Zurück zur Startseite</a>

    <div id="game-container">
        <div id="score-board">💰 <span id="score">0</span></div>
        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>
        
        <div id="player" style="left: 120px;">🏃</div>
        
        <div id="game-overlay">
            <h2 id="overlay-title">SURF RUN</h2>
            <button id="start-btn" onclick="startGame()">Spielen</button>
        </div>
    </div>
    
    <!-- Sichtbare Touch-Controls für Mobile -->
    <div id="touch-controls">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
    </div>

    <div class="controls-hint">💻 Steuerung mit Pfeiltasten (Links/Rechts)</div>

    <script>
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');
        const gameOverlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');
        
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        // Game Variables
        let currentLane = 1; 
        const playerLanePositions = [20, 120, 220]; 
        const obstacleLanePositions = [10, 110, 210];
        
        let obstacles = [];
        let score = 0;
        let isPlaying = false;
        let speed = 5;
        let animationId;
        let frames = 0;
        let spawnRate = 70;

        // --- Controls ---
        
        function moveLeft() {
            if (!isPlaying) return;
            if (currentLane > 0) {
                currentLane--;
                updatePlayerPosition();
            }
        }

        function moveRight() {
            if (!isPlaying) return;
            if (currentLane < 2) {
                currentLane++;
                updatePlayerPosition();
            }
        }

        function updatePlayerPosition() {
            player.style.left = playerLanePositions[currentLane] + 'px';
        }

        // Tastatur
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
        });

        // Touch Buttons (mit preventDefault, um Scrollen/Zoomen beim Tippen zu verhindern)
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
        
        // Backup: Klick-Event, falls jemand am PC das Fenster sehr klein zieht
        btnLeft.addEventListener('mousedown', moveLeft);
        btnRight.addEventListener('mousedown', moveRight);

        // Unsichtbare Swipe-Steuerung (als Backup weiterhin aktiv)
        let touchStartX = 0;
        gameContainer.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});
        gameContainer.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 30) moveLeft();
            if (touchEndX > touchStartX + 30) moveRight();
        }, {passive: true});

        // --- Game Loop ---

        function startGame() {
            document.querySelectorAll('.obstacle').forEach(ob => ob.remove());
            obstacles = [];
            score = 0;
            speed = 5;
            frames = 0;
            spawnRate = 70;
            currentLane = 1;
            
            updatePlayerPosition();
            scoreElement.innerText = score;
            gameOverlay.style.display = 'none';
            isPlaying = true;
            
            update();
        }

        function update() {
            if (!isPlaying) return;
            
            frames++;
            
            if (frames % spawnRate === 0) {
                spawnObstacle();
                if (spawnRate > 30) spawnRate -= 1; 
                speed += 0.05;
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                let top = parseFloat(obs.style.top);
                top += speed;
                obs.style.top = top + 'px';

                let obsLane = parseInt(obs.dataset.lane);
                
                if (top > 250 && top < 410 && obsLane === currentLane) {
                    endGame();
                    return;
                }

                if (top > 450) {
                    obs.remove();
                    obstacles.splice(i, 1);
                    i--;
                    score += 10;
                    scoreElement.innerText = score;
                }
            }

            animationId = requestAnimationFrame(update);
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const obs = document.createElement('div');
            obs.classList.add('obstacle');
            obs.innerText = '🚆'; 
            obs.dataset.lane = lane;
            
            obs.style.left = obstacleLanePositions[lane] + 'px';
            obs.style.top = '-120px'; 
            
            gameContainer.appendChild(obs);
            obstacles.push(obs);
        }

        function endGame() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            overlayTitle.innerText = "CRASH!";
            startBtn.innerText = "Nochmal";
            gameOverlay.style.display = 'flex';
        }
    </script>
</body>
</html>
